plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.rikka.tools.refine'
}

android {
    namespace 'com.gitee.connect_screen'
    compileSdk 34
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.gitee.connect_screen"
        minSdk 29
        targetSdk 34
        versionCode 33
        versionName "1.3.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    buildFeatures {
        compose true
        aidl true
        buildConfig true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    sourceSets {
        main {
            java.srcDirs += rootProject.file("vendor/android-change-resolution/app/src/main/java")
            assets.srcDirs += "$buildDir/generated/qtiAssets"
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation('com.google.android.material:material:1.12.0') {
        exclude group: 'com.google.errorprone'
    }
    implementation libs.androidx.window
    compileOnly project(':hidden-api-stub')
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'dev.rikka.tools.refine:runtime:4.4.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'com.google.zxing:core:3.5.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// ---- Qualcomm 原生探针：由 android-change-resolution 子模块编译生成 ----
def qtiProbeSource = rootProject.file("vendor/android-change-resolution/app/src/main/cpp/qti_display_probe.cpp")
def qtiProbeOutput = layout.buildDirectory.file("generated/qtiAssets/native/arm64-v8a/qti-display-probe")

def ndkClangForHost() {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir == null || sdkDir.trim().isEmpty()) return null
    def ndkRoot = file("${sdkDir}/ndk")
    if (!ndkRoot.exists()) return null
    def ndkDir = ndkRoot.listFiles()
            .findAll { it.isDirectory() }
            .sort { a, b -> b.name <=> a.name }
            .first()
    def prebuiltRoot = file("${ndkDir}/toolchains/llvm/prebuilt")
    if (!prebuiltRoot.exists()) return null

    def os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    def osDir = os.contains("win") ? "windows" : os.contains("mac") ? "darwin" : "linux"
    def arch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
    def archDir = (arch.contains("aarch64") || arch.contains("arm64")) ? "aarch64" : "x86_64"
    def hostDir = "${osDir}-${archDir}"

    def candidates = prebuiltRoot.listFiles()
            .findAll { it.isDirectory() && it.name == hostDir && new File(it, "bin/aarch64-linux-android26-clang++").exists() }
    if (!candidates) return null
    return new File(candidates.first(), "bin/aarch64-linux-android26-clang++")
}

tasks.register("buildQtiDisplayProbe", Exec) {
    inputs.file(qtiProbeSource)
    outputs.file(qtiProbeOutput)
    onlyIf { ndkClangForHost() != null }

    doFirst {
        def clang = ndkClangForHost()
        if (clang == null) {
            logger.warn("qti-display-probe: 未找到可用的 NDK 主机工具链，跳过原生探针。")
            return
        }
        qtiProbeOutput.get().asFile.parentFile.mkdirs()
        commandLine clang.absolutePath,
                "-std=c++17",
                "-Wall",
                "-Wextra",
                "-Werror",
                "-Os",
                "-s",
                "-fPIE",
                "-pie",
                "-static-libstdc++",
                qtiProbeSource.absolutePath,
                "-ldl",
                "-o",
                qtiProbeOutput.get().asFile.absolutePath
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn("buildQtiDisplayProbe")
} 