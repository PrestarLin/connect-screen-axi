name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;36.1.0"
          sdkmanager --install "ndk;27.0.12077973"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish APK to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E 'versionName[[:space:]]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VER}-${GITHUB_SHA::7}"
          APK="apk/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$APK" \
            --title "屏连·副屏 ${TAG}" \
            --notes "Debug build of commit ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" \
            --prerelease
          echo "Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"